# Supabase project configuration
# This file configures Supabase CLI behavior

[functions.push]
# Disable JWT verification for webhook endpoint
# Webhooks use shared secret (x-webhook-secret header) instead
verify_jwt = false

[functions.waitlist-signup]
# Disable JWT verification — function is called anonymously from the
# static Next.js marketing site. The function uses its own service-role
# client to call the SECURITY DEFINER RPC `claim_waitlist_signup`.
verify_jwt = false

[functions.waitlist-confirm]
# Disable JWT verification — function is reached by the GET link in the
# transactional confirmation email. No client auth context.
verify_jwt = false

[functions.waitlist-forget]
# Disable JWT verification — function authenticates via the
# email_confirmation_token in the POST body (the token IS the proof of
# identity). GDPR Article 17 right-to-erasure for unconfirmed signups.
verify_jwt = false

[functions.waitlist-blog-subscribe]
# Disable JWT verification — function is called anonymously from the
# marketing-site blog sidebar's "Get new posts" form. The function uses
# its own service-role client to insert directly into waitlist_signups
# with source='blog_subscribe'.
verify_jwt = false

[functions.support-submit]
# Disable JWT verification — function is called anonymously from the
# static marketing site /support page. The function uses its own
# service-role client to call the SECURITY DEFINER RPC
# `submit_support_request`. CORS is locked to chemirl.app origins via
# the shared WAITLIST_ALLOWED_ORIGINS allowlist.
verify_jwt = false

# Authenticated mobile-client functions below. JWT verification is on by
# default (no `verify_jwt = false`); the function bodies still re-check
# auth.uid() against the operation they perform.

[functions.iris-chat]
# Authenticated. Streams conversational responses from the AI concierge.
# Called by mobile/src/components/IrisChatModal.tsx.

[functions.iris-forget]
# Authenticated. GDPR Article 17 right-to-erasure for the AI concierge
# transcript + derived profile. Called by the in-app settings flow.

[functions.moderate-photo]
# Authenticated. Server-side photo moderation gate invoked from
# mobile/src/screens/onboarding/PhotoVerificationScreen.tsx and
# mobile/src/screens/profile/ProfileScreen.tsx via the
# mobile/src/lib/photoModeration.ts client wrapper.

[functions.validate-receipt]
# Authenticated. Verifies iOS / Android in-app purchase receipts for
# token packs. Called by mobile/src/lib/iap.ts from the
# purchaseUpdatedListener after a successful purchase.

[functions.validate-subscription]
# Authenticated. Verifies iOS / Android subscription receipts and writes
# the entitlement row. Called by mobile/src/lib/iap.ts on
# `chem_plus_monthly` purchases.

# Email Templates Configuration
# These templates are used for local development with Supabase CLI
# For hosted projects, configure templates in the Supabase Dashboard:
# Authentication → Email Templates

# Email confirmation template (used for OTP emails - code-only, no links)
# This template is used when email confirmation is enabled
# IMPORTANT: Template must use {{ .Token }} for code, NOT confirmation links
[auth.email.template.confirmation]
subject = "Your Chem IRL verification code"
content_path = "./supabase/templates/confirmation.html"

