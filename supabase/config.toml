# Supabase project configuration
# This file configures Supabase CLI behavior

[functions.push]
# Disable JWT verification for webhook endpoint
# Webhooks use shared secret (x-webhook-secret header) instead
verify_jwt = false

[functions.waitlist-signup]
# Disable JWT verification — function is called anonymously from the
# static Next.js marketing site. The function uses its own service-role
# client to call the SECURITY DEFINER RPC `claim_waitlist_signup`.
verify_jwt = false

[functions.waitlist-confirm]
# Disable JWT verification — function is reached by the GET link in the
# transactional confirmation email. No client auth context.
verify_jwt = false

[functions.waitlist-forget]
# Disable JWT verification — function authenticates via the
# email_confirmation_token in the POST body (the token IS the proof of
# identity). GDPR Article 17 right-to-erasure for unconfirmed signups.
verify_jwt = false

# Email Templates Configuration
# These templates are used for local development with Supabase CLI
# For hosted projects, configure templates in the Supabase Dashboard:
# Authentication → Email Templates

# Email confirmation template (used for OTP emails - code-only, no links)
# This template is used when email confirmation is enabled
# IMPORTANT: Template must use {{ .Token }} for code, NOT confirmation links
[auth.email.template.confirmation]
subject = "Your Chem IRL verification code"
content_path = "./supabase/templates/confirmation.html"

