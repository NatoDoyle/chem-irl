name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Least-privilege: every job here only reads the repo (type-check, lint, build,
# tests). Pin the default GITHUB_TOKEN to read-only so a compromised action
# can't push commits, open releases, or mutate the repo.
permissions:
  contents: read

# Cancel superseded in-progress runs on the same ref so rapid pushes / force
# pushes don't pile up redundant builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Run tests
        run: bunx jest -c jest.unit.config.js

  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check markdown links
        run: bun run docs:check

  brand:
    name: Brand Tokens
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check brand token sync
        run: bun run brand:check

  # Aggregate CI outcome → one Bronto `ci_run` event (service chem-irl-app,
  # layer ci; env: production on main pushes, staging on PRs). Strictly
  # fail-open, mirroring blog-sync.yml's emit: skipped when the secret is
  # absent (e.g. fork PRs), continue-on-error + `|| true` around the curl —
  # a Bronto outage can never fail CI. blog-sync's chem-irl-cmo emit is a
  # separate stream and untouched.
  bronto:
    name: Emit CI event
    runs-on: ubuntu-latest
    needs: [mobile, web, docs, brand]
    if: always()

    steps:
      - name: Emit ci_run to Bronto (fail-open)
        continue-on-error: true
        env:
          BRONTO_API_KEY: ${{ secrets.BRONTO_API_KEY }}
          R_MOBILE: ${{ needs.mobile.result }}
          R_WEB: ${{ needs.web.result }}
          R_DOCS: ${{ needs.docs.result }}
          R_BRAND: ${{ needs.brand.result }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ -z "$BRONTO_API_KEY" ]; then
            echo "BRONTO_API_KEY not set; skipping emit"
            exit 0
          fi
          # Only genuine failures are errors. Superseded runs (concurrency
          # cancel-in-progress) report their jobs as "cancelled" — that says
          # nothing about the code, so a fully-cancelled run emits nothing
          # at all instead of polluting Bronto with false status=error.
          STATUS=ok
          ALL_CANCELLED=yes
          for r in "$R_MOBILE" "$R_WEB" "$R_DOCS" "$R_BRAND"; do
            [ "$r" = "failure" ] && STATUS=error
            [ "$r" = "cancelled" ] || ALL_CANCELLED=no
          done
          if [ "$ALL_CANCELLED" = "yes" ]; then
            echo "run superseded (all jobs cancelled); skipping emit"
            exit 0
          fi
          ENV=staging
          [ "$IS_MAIN_PUSH" = "true" ] && ENV=production
          curl -sf -X POST https://ingestion.eu.bronto.io \
            -H "x-bronto-api-key: $BRONTO_API_KEY" \
            -H "x-bronto-service-name: chem-irl-app" \
            -H "Content-Type: application/json" \
            -d "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"service\":\"chem-irl-app\",\"env\":\"$ENV\",\"layer\":\"ci\",\"event\":\"ci_run\",\"status\":\"$STATUS\",\"workflow\":\"CI\",\"branch\":\"$BRANCH\",\"sha\":\"$GITHUB_SHA\",\"pr\":\"$PR_NUMBER\",\"job_mobile\":\"$R_MOBILE\",\"job_web\":\"$R_WEB\",\"job_docs\":\"$R_DOCS\",\"job_brand\":\"$R_BRAND\"}" || true

